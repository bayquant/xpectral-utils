[project]
name = "xpectral-utils"
version = "0.1.0"
description = "Shared utility functions for xpectral projects"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "BayQuant" }
]
keywords = ["utils", "quant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = []

[project.optional-dependencies]
s3 = ["boto3>=1.34"]  # xpectral_utils.s3

[project.urls]
Homepage = "https://github.com/bayquant/xpectral-utils"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.6", # code formatter and linter
    "pre-commit>=4.4.0", # git hook manager
    "pytest>=8.0.0", # test runner
    "ipykernel>=7.0.1", # jupyter notebook support
    "boto3>=1.34", # tests for xpectral_utils.s3 (the s3 extra at runtime)
]

[tool.hatch.build.targets.wheel]
packages = ["xpectral_utils"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # Line too long: handled by formatter, not linter
]

[tool.ruff.lint.isort]
known-first-party = ["xpectral_utils"]
force-single-line = true
